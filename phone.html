<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Phone Controller</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#111; color:#fff; font-family:Arial, sans-serif; text-align:center; user-select:none; }
  .screen { display:none; height:100%; padding:16px; }
  .screen.on { display:flex; flex-direction:column; justify-content:center; align-items:center; }
  input { font-size:44px; width:220px; text-align:center; letter-spacing:8px; padding:10px; border-radius:12px; border:0; direction:ltr; }
  button { font-size:22px; border:0; border-radius:16px; padding:14px 26px; margin:8px; color:#fff; background:#2d7ff9; }
  #fire { width:88%; height:34%; font-size:48px; background:#e53935; border-radius:28px; }
  #ammo { font-size:34px; min-height:44px; letter-spacing:4px; color:#ffd54f; }
  #rel { background:#8e24aa; }
  #gear { position:fixed; top:10px; left:10px; z-index:20; background:#333; padding:8px 14px; font-size:22px; margin:0; border-radius:12px; }
  #set { display:none; position:fixed; left:0; right:0; bottom:0; z-index:30; background:#1c1c1c; border-top:2px solid #555; padding:16px; }
  #set input[type=range] { width:90%; direction:ltr; }
  #set button { background:#555; font-size:18px; padding:10px 16px; }
  #set .srow { font-size:20px; margin:6px; }
  #cal { background:#555; }
  #msg { margin-top:12px; color:#f99; min-height:24px; }
  #banner { width:100%; padding:12px; border-radius:14px; font-size:26px; font-weight:bold; background:#444; color:#000; }
  #score { font-size:76px; font-weight:bold; margin:2px 0; }
  #phase { font-size:19px; color:#ccc; min-height:48px; padding:0 10px; }
</style>
</head>
<body>

<div id="s1" class="screen on">
  <h2>اكتب الكود اللي على التلفزيون</h2>
  <input id="code" type="tel" maxlength="4" placeholder="0000">
  <button id="go">اتصال</button>
  <div id="msg"></div>
</div>

<div id="s2" class="screen">
  <div id="banner">بانتظار التسجيل...</div>
  <div id="score">0</div>
  <div id="ammo"></div>
  <div id="phase"></div>
  <button id="fire">🔫 اضرب</button>
  <div>
    <button id="rel">🔄 تعبئة</button>
    <button id="cal">معايرة</button>
  </div>
</div>

<button id="gear">⚙</button>
<div id="set">
  <div class="srow">الحساسية: <span id="sensv">7</span></div>
  <input id="sens" type="range" min="1" max="10" step="1" value="7">
  <div class="srow" style="display:flex;justify-content:space-between;direction:ltr;font-size:14px;color:#aaa;padding:0 5%;"><span>LOW</span><span>HIGH</span></div>
  <button id="flipx">↔ عكس يمين/شمال</button>
  <button id="flipy">↕ عكس فوق/تحت</button>
  <button id="setclose">تم</button>
</div>

<script src="config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = ["#ff3b30", "#0a84ff", "#ffcc00", "#30d158"];
  var params = location.search.match(/[?&]r=(\d{4})/);
  if (params) { $("code").value = params[1]; }

  var id = Math.random().toString(36).substr(2, 6);
  var room = null, url = null, tvUrl = null;

  // ===== إعدادات التصويب =====
  var RANGE_X = 40, RANGE_Y = 30;   // الزاوية (بالدرجات) اللي تغطي الشاشة كلها. رقم أكبر = حساسية أقل
  var SIGN_X = 1;                   // لو اليمين/الشمال اتعكسوا غيّرها لـ -1
  var SIGN_Y = 1;                   // لو فوق/تحت اتعكسوا غيّرها لـ -1
  var USE_SENSOR_API = true;        // false = يستخدم الطريقة القديمة (deviceorientation) فقط

  var out = { x: 0.5, y: 0.5, f: 0, r: 0, t: 1 };
  var SHAKE_LIMIT = 30;             // قوة الهزة لإعادة التعبئة (رقم أكبر = لازم هزة أقوى)
  var sending = false, dirty = true;
  var tv = {}, lastScore = 0;

  function wrap(d) { while (d > 180) d -= 360; while (d < -180) d += 360; return d; }
  function clamp(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function deg(r) { return r * 180 / Math.PI; }

  // ---------- إرسال ----------
  function send() {
    if (sending || !dirty || !url) return;
    sending = true; dirty = false;
    out.t = new Date().getTime();
    var r = new XMLHttpRequest();
    r.open("PUT", url, true);
    r.onreadystatechange = function () {
      if (r.readyState === 4) { sending = false; if (dirty) send(); }
    };
    r.send(JSON.stringify(out));
  }
  setInterval(send, 40);
  setInterval(function () { dirty = true; }, 1500);   // نبضة عشان التلفزيون يعرف إنك متصل

  // ---------- التصويب (اتجاه الموبايل في الفراغ) ----------
  // axes.y = اتجاه الحافة العلوية للموبايل، axes.z = اتجاه ضهر الشاشة (كل واحد في إحداثيات العالم)
  var axes = null, base = null, src = null;

  function pointing(axis) {
    if (axis === "y") { return axes.y; }
    return [-axes.z[0], -axes.z[1], -axes.z[2]];      // الكاميرا الخلفية
  }
  function angles(p) {
    var s = Math.max(-1, Math.min(1, p[2]));
    return { yaw: deg(Math.atan2(p[0], p[1])), pitch: deg(Math.asin(s)) };
  }
  function calibrate() {
    if (!axes) return;
    // نختار المحور الأقرب للأفقي: لو ماسك الموبايل مسطح = الحافة العلوية، ولو واقف = الكاميرا الخلفية
    var ax = Math.abs(axes.y[2]) < Math.abs(axes.z[2]) ? "y" : "z";
    var a = angles(pointing(ax));
    base = { axis: ax, yaw: a.yaw, pitch: a.pitch };
  }
  function update() {
    if (!axes) return;
    if (!base) { calibrate(); }
    var a = angles(pointing(base.axis));
    var dx = wrap(a.yaw - base.yaw);
    var dy = a.pitch - base.pitch;
    out.x = clamp(0.5 + SIGN_X * dx / (RANGE_X * 2));
    out.y = clamp(0.5 - SIGN_Y * dy / (RANGE_Y * 2));
    dirty = true;
  }

  // مصدر 1: الحساس الحديث (جيروسكوب + عجلة بدون بوصلة)، ما بيتأثرش بالمغناطيس
  function fromQuat(q) {
    if (src === "euler") return;
    src = "quat";
    var x = q[0], y = q[1], z = q[2], w = q[3];
    axes = {
      y: [2 * (x * y - w * z), 1 - 2 * (x * x + z * z), 2 * (y * z + w * x)],
      z: [2 * (x * z + w * y), 2 * (y * z - w * x), 1 - 2 * (x * x + y * y)]
    };
    update();
  }
  // مصدر 2: deviceorientation (احتياطي، وللآيفون)
  function fromEuler(e) {
    if (src === "quat") return;
    if (e.alpha === null || e.beta === null || e.gamma === null) return;
    src = "euler";
    var r = Math.PI / 180, a = e.alpha * r, b = e.beta * r, g = e.gamma * r;
    var sa = Math.sin(a), ca = Math.cos(a), sb = Math.sin(b), cb = Math.cos(b), sg = Math.sin(g), cg = Math.cos(g);
    axes = {
      y: [-sa * cb, ca * cb, sb],
      z: [ca * sg + sa * sb * cg, sa * sg - sb * cg * ca, cb * cg]
    };
    update();
  }

  var eulerOn = false;
  function startEuler(cb) {
    if (eulerOn) { if (cb) cb(true); return; }
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(function (s) {
        if (s === "granted") { eulerOn = true; window.addEventListener("deviceorientation", fromEuler, true); if (cb) cb(true); }
        else if (cb) cb(false);
      })["catch"](function () { if (cb) cb(false); });
    } else if (window.DeviceOrientationEvent) {
      eulerOn = true;
      window.addEventListener("deviceorientation", fromEuler, true);
      if (cb) cb(true);
    } else if (cb) { cb(false); }
  }

  function startSensors(cb) {
    if (USE_SENSOR_API && window.RelativeOrientationSensor) {
      try {
        var s = new RelativeOrientationSensor({ frequency: 60, referenceFrame: "device" });
        var got = false;
        s.addEventListener("reading", function () { got = true; if (s.quaternion) { fromQuat(s.quaternion); } });
        s.addEventListener("error", function () { if (!got) { startEuler(null); } });
        s.start();
        setTimeout(function () { if (!got) { startEuler(null); } }, 1500);
        cb(true);
        return;
      } catch (e) {}
    }
    startEuler(cb);
  }

  // ---------- استقبال حالة اللعبة من التلفزيون ----------
  function setAt(obj, parts, val) {
    if (parts.length === 0) { return val; }
    if (obj === null || typeof obj !== "object") { obj = {}; }
    obj[parts[0]] = setAt(obj[parts[0]], parts.slice(1), val);
    return obj;
  }
  function onTv(type, m) {
    var parts = m.path.split("/").filter(function (s) { return s; });
    if (type === "put") { tv = setAt(tv, parts, m.data); }
    else if (m.data && typeof m.data === "object") {
      for (var k in m.data) { tv = setAt(tv, parts.concat([k]), m.data[k]); }
    }
    if (tv === null || typeof tv !== "object") { tv = {}; }
    render();
  }
  function listenTv() {
    var es = new EventSource(tvUrl);
    function h(ev) {
      try { var m = JSON.parse(ev.data); if (m) { onTv(ev.type, m); } } catch (e) {}
    }
    es.addEventListener("put", h, false);
    es.addEventListener("patch", h, false);
  }
  var PHASES = {
    menu: "صوّب على الشاشة واختار نوع اللعب، واضغط اضرب",
    time: "اختار الوقت من الشاشة",
    count: "استعد!",
    play: "اضرب البطات!",
    end: "انتهت الجولة"
  };
  function render() {
    var slot = tv.slots ? tv.slots[id] : undefined;
    var b = $("banner");
    if (slot === undefined) {
      b.innerHTML = "بانتظار التسجيل..."; b.style.background = "#444";
    } else {
      b.innerHTML = "أنت اللاعب " + (slot + 1); b.style.background = COLORS[slot];
    }
    var sc = (slot !== undefined && tv.scores) ? (tv.scores[slot] || 0) : 0;
    if (sc > lastScore && navigator.vibrate) { navigator.vibrate(80); }
    lastScore = sc;
    $("score").innerHTML = sc;
    var am = (slot !== undefined && tv.ammo) ? tv.ammo[slot] : null;
    var rl = (slot !== undefined && tv.rl) ? tv.rl[slot] : 0;
    var mag = tv.mag || 3, bullets = "", bi;
    if (am === null || am === undefined || (tv.phase !== "play" && tv.phase !== "count")) {
      $("ammo").innerHTML = "";
    } else if (rl) {
      $("ammo").style.color = "#ffd54f"; $("ammo").innerHTML = "جاري التعبئة...";
    } else if (am <= 0) {
      $("ammo").style.color = "#ff5252"; $("ammo").innerHTML = "فاضي! هز الموبايل";
    } else {
      for (bi = 0; bi < mag; bi++) { bullets += (bi < am ? "● " : "○ "); }
      $("ammo").style.color = "#ffd54f"; $("ammo").innerHTML = bullets;
    }
    var msg = PHASES[tv.phase] || "";
    if (tv.mode === 3 && tv.lvl) { msg = "مرحلة " + tv.lvl + ": " + msg; }
    $("phase").innerHTML = msg;
  }

  // ---------- الأزرار ----------
  $("go").onclick = function () {
    var c = $("code").value;
    if (!/^\d{4}$/.test(c)) { $("msg").innerHTML = "الكود لازم 4 أرقام"; return; }
    if (!window.isSecureContext && location.hostname !== "localhost") {
      $("msg").innerHTML = "لازم الصفحة تتفتح بـ HTTPS";
    }
    room = c;
    url = DB_URL + "/rooms/" + room + "/players/" + id + ".json";
    tvUrl = DB_URL + "/rooms/" + room + "/tv.json";
    startMotion();
    startSensors(function (ok) {
      if (!ok) { $("msg").innerHTML = "الحساسات مش متاحة أو اتمنعت"; return; }
      $("s1").className = "screen"; $("s2").className = "screen on";
      base = null;
      dirty = true; send();
      listenTv();
    });
  };

  $("cal").onclick = function () {
    calibrate();
    dirty = true;
  };

  // ---------- إعادة التعبئة: زرار أو هزة قوية للموبايل ----------
  var lastReloadAt = 0;
  function doReload() {
    var t = new Date().getTime();
    if (t - lastReloadAt < 700) return;
    lastReloadAt = t;
    out.r = out.r + 1;
    dirty = true; send();
    if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
  }
  $("rel").onclick = doReload;
  $("rel").ontouchstart = function (e) { e.preventDefault(); doReload(); };
  function onMotion(e) {
    var a = e.accelerationIncludingGravity;
    if (!a) return;
    var m = Math.sqrt((a.x || 0) * (a.x || 0) + (a.y || 0) * (a.y || 0) + (a.z || 0) * (a.z || 0));
    if (m > SHAKE_LIMIT) doReload();
  }
  function startMotion() {
    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === "function") {
      DeviceMotionEvent.requestPermission().then(function (s) {
        if (s === "granted") { window.addEventListener("devicemotion", onMotion, true); }
      })["catch"](function () {});
    } else if (window.DeviceMotionEvent) {
      window.addEventListener("devicemotion", onMotion, true);
    }
  }

  // ---------- الإعدادات: الحساسية واتجاه الحركة (بتتحفظ على الموبايل) ----------
  var sens = 7;
  function saveSet() {
    try { localStorage.setItem("duck_set", JSON.stringify({ sens: sens, sx: SIGN_X, sy: SIGN_Y })); } catch (e) {}
  }
  function applySet() {
    RANGE_X = 100 - sens * 8;
    RANGE_Y = RANGE_X * 0.75;
    $("sensv").innerHTML = sens;
    $("sens").value = sens;
    $("flipx").style.background = SIGN_X < 0 ? "#2e7d32" : "#555";
    $("flipy").style.background = SIGN_Y < 0 ? "#2e7d32" : "#555";
  }
  try {
    var saved = localStorage.getItem("duck_set");
    if (saved) {
      var so = JSON.parse(saved);
      if (so.sens) { sens = so.sens; }
      if (so.sx) { SIGN_X = so.sx; }
      if (so.sy) { SIGN_Y = so.sy; }
    }
  } catch (e) {}
  applySet();
  $("sens").oninput = function () { sens = parseInt($("sens").value, 10); applySet(); saveSet(); };
  $("flipx").onclick = function () { SIGN_X = -SIGN_X; applySet(); saveSet(); };
  $("flipy").onclick = function () { SIGN_Y = -SIGN_Y; applySet(); saveSet(); };
  $("gear").onclick = function () { $("set").style.display = $("set").style.display === "block" ? "none" : "block"; };
  $("setclose").onclick = function () { $("set").style.display = "none"; };

  $("fire").onclick = function () {
    out.f = out.f + 1;
    dirty = true; send();
    if (navigator.vibrate) navigator.vibrate(40);
  };
  $("fire").ontouchstart = function (e) { e.preventDefault(); $("fire").onclick(); };
})();
</script>
</body>
</html>
