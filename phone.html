<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Phone Controller</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#111; color:#fff; font-family:Arial, sans-serif; text-align:center; user-select:none; }
  .screen { display:none; height:100%; padding:16px; }
  .screen.on { display:flex; flex-direction:column; justify-content:center; align-items:center; }
  input { font-size:44px; width:220px; text-align:center; letter-spacing:8px; padding:10px; border-radius:12px; border:0; direction:ltr; }
  button { font-size:22px; border:0; border-radius:16px; padding:14px 26px; margin:8px; color:#fff; background:#2d7ff9; }
  #fire { width:88%; height:42%; font-size:48px; background:#e53935; border-radius:28px; }
  #cal { background:#555; }
  #msg { margin-top:12px; color:#f99; min-height:24px; }
  #banner { width:100%; padding:12px; border-radius:14px; font-size:26px; font-weight:bold; background:#444; color:#000; }
  #score { font-size:76px; font-weight:bold; margin:2px 0; }
  #phase { font-size:19px; color:#ccc; min-height:48px; padding:0 10px; }
</style>
</head>
<body>

<div id="s1" class="screen on">
  <h2>اكتب الكود اللي على التلفزيون</h2>
  <input id="code" type="tel" maxlength="4" placeholder="0000">
  <button id="go">اتصال</button>
  <div id="msg"></div>
</div>

<div id="s2" class="screen">
  <div id="banner">بانتظار التسجيل...</div>
  <div id="score">0</div>
  <div id="phase"></div>
  <button id="fire">🔫 11اضرب</button>
  <button id="cal">معايرة (المنتصف)</button>
</div>

<script src="config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = ["#ff3b30", "#0a84ff", "#ffcc00", "#30d158"];
  var params = location.search.match(/[?&]r=(\d{4})/);
  if (params) { $("code").value = params[1]; }

  var id = Math.random().toString(36).substr(2, 6);
  var room = null, url = null, tvUrl = null;
  var base = null, last = null;
  var RANGE_X = 20, RANGE_Y = 10;        // قيمة أصغر = حساسية أعلى
  var out = { x: 0.5, y: 0.5, f: 0, t: 1 };
  var sending = false, dirty = true;
  var tv = {}, lastScore = 0;

  function wrap(d) { while (d > 180) d -= 360; while (d < -180) d += 360; return d; }
  function clamp(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  // ---------- إرسال ----------
  function send() {
    if (sending || !dirty || !url) return;
    sending = true; dirty = false;
    out.t = new Date().getTime();
    var r = new XMLHttpRequest();
    r.open("PUT", url, true);
    r.onreadystatechange = function () {
      if (r.readyState === 4) { sending = false; if (dirty) send(); }
    };
    r.send(JSON.stringify(out));
  }
  setInterval(send, 40);
  setInterval(function () { dirty = true; }, 1500);   // نبضة عشان التلفزيون يعرف إنك متصل

  // ---------- الحساس ----------
  function onOrient(e) {
    if (e.alpha === null) return;
    last = { a: e.alpha, b: e.beta };
    if (!base) { base = { a: last.a, b: last.b }; }   // معايرة تلقائية أول مرة
    var dx = wrap(last.a - base.a);
    var dy = last.b - base.b;
    out.x = clamp(0.5 - dx / (RANGE_X * 2));
    out.y = clamp(0.5 - dy / (RANGE_Y * 2));
    dirty = true;
  }
  function startSensors(cb) {
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(function (s) {
        if (s === "granted") { window.addEventListener("deviceorientation", onOrient, true); cb(true); }
        else cb(false);
      })["catch"](function () { cb(false); });
    } else if (window.DeviceOrientationEvent) {
      window.addEventListener("deviceorientation", onOrient, true);
      cb(true);
    } else { cb(false); }
  }

  // ---------- استقبال حالة اللعبة من التلفزيون ----------
  function setAt(obj, parts, val) {
    if (parts.length === 0) { return val; }
    if (obj === null || typeof obj !== "object") { obj = {}; }
    obj[parts[0]] = setAt(obj[parts[0]], parts.slice(1), val);
    return obj;
  }
  function onTv(type, m) {
    var parts = m.path.split("/").filter(function (s) { return s; });
    if (type === "put") { tv = setAt(tv, parts, m.data); }
    else if (m.data && typeof m.data === "object") {
      for (var k in m.data) { tv = setAt(tv, parts.concat([k]), m.data[k]); }
    }
    if (tv === null || typeof tv !== "object") { tv = {}; }
    render();
  }
  function listenTv() {
    var es = new EventSource(tvUrl);
    function h(ev) {
      try { var m = JSON.parse(ev.data); if (m) { onTv(ev.type, m); } } catch (e) {}
    }
    es.addEventListener("put", h, false);
    es.addEventListener("patch", h, false);
  }
  var PHASES = {
    menu: "صوّب على الشاشة واختار نوع اللعب، واضغط اضرب",
    time: "اختار الوقت من الشاشة",
    count: "استعد!",
    play: "اضرب البطات!",
    end: "انتهت الجولة"
  };
  function render() {
    var slot = tv.slots ? tv.slots[id] : undefined;
    var b = $("banner");
    if (slot === undefined) {
      b.innerHTML = "بانتظار التسجيل..."; b.style.background = "#444";
    } else {
      b.innerHTML = "أنت اللاعب " + (slot + 1); b.style.background = COLORS[slot];
    }
    var sc = (slot !== undefined && tv.scores) ? (tv.scores[slot] || 0) : 0;
    if (sc > lastScore && navigator.vibrate) { navigator.vibrate(80); }
    lastScore = sc;
    $("score").innerHTML = sc;
    $("phase").innerHTML = PHASES[tv.phase] || "";
  }

  // ---------- الأزرار ----------
  $("go").onclick = function () {
    var c = $("code").value;
    if (!/^\d{4}$/.test(c)) { $("msg").innerHTML = "الكود لازم 4 أرقام"; return; }
    if (!window.isSecureContext && location.hostname !== "localhost") {
      $("msg").innerHTML = "لازم الصفحة تتفتح بـ HTTPS";
    }
    room = c;
    url = DB_URL + "/rooms/" + room + "/players/" + id + ".json";
    tvUrl = DB_URL + "/rooms/" + room + "/tv.json";
    startSensors(function (ok) {
      if (!ok) { $("msg").innerHTML = "الحساسات مش متاحة أو اتمنعت"; return; }
      $("s1").className = "screen"; $("s2").className = "screen on";
      base = null;
      dirty = true; send();
      listenTv();
    });
  };

  $("cal").onclick = function () {
    if (!last) return;
    base = { a: last.a, b: last.b };
    dirty = true;
  };

  $("fire").onclick = function () {
    out.f = out.f + 1;
    dirty = true; send();
    if (navigator.vibrate) navigator.vibrate(40);
  };
  $("fire").ontouchstart = function (e) { e.preventDefault(); $("fire").onclick(); };
})();
</script>
</body>
</html>
